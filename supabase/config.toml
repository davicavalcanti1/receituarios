# Config do Supabase CLI. Referência completa:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "receituarios"

[api]
enabled = true
port = 54321
# "receituarios" precisa estar aqui E em Settings → API → Exposed schemas do
# projeto hospedado — senão o PostgREST não enxerga as tabelas do módulo.
schemas = ["public", "graphql_public", "receituarios"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
minimum_password_length = 6

[studio]
enabled = true
port = 54323
